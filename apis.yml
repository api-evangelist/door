aid: door
name: Door
description: >-
  DOOR (formerly Latch) is a multifamily proptech company providing a smart-building access and
  building-intelligence platform. It unifies smart locks, readers, intercoms, cameras, thermostats
  and sensors with software (DOOR OS) for property managers, and integrates with property-management
  systems such as Yardi, RealPage, Entrata, and AppFolio. DOOR exposes its capabilities to authorized
  partners through OpenDOOR - a set of REST APIs plus native iOS, Android, and Web SDKs - letting
  partner apps enumerate buildings, doors, keys, and users and grant, update, or revoke resident
  access. The API is secured with Auth0-issued JWTs (partner-scoped machine-to-machine and user-scoped
  passwordless tokens). This profile was enriched by the API Evangelist pipeline from DOOR's public
  developer hub at developers.door.com.
